name: Installation and offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install standard benchmark and tests
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c "import pandas, seaborn"
      - name: Check all paper presets without API SDKs
        run: python scripts/dev/check_installation.py
      - name: Run offline test suite
        run: python -m pytest -q
      - name: Install Linux rendering library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6
      - name: Render all five paper scenes on Linux
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: osmesa
        run: python scripts/dev/check_installation.py --render
      - name: Install optional API SDKs
        run: python -m pip install -r requirements-providers.txt
      - name: Check API SDK imports without requests
        run: |
          python -m pip check
          python scripts/dev/check_installation.py --providers
      - name: Check tracked files were not modified
        run: git diff --exit-code

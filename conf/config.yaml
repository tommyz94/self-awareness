defaults:
  - _self_
  - experiment: null

env: mujoco
nav: human
client: ollama
print_reasoning: false
distractors: 0
max_steps: 100
msr_level: 2
seed: null
guided_prompt: false
third_person: false
camera_height: 1.0
body_style: default
self_perception_mode: color
random_wall_color: false
distractor_color_mode: allow_duplicates
e7_random_cube_heights: false
save_dataset: false
history_steps: 1
num_runs: 1
experiment_id: null

ollama:
  host: http://localhost:11555

openai:
  api_key: ""

openrouter:
  api_key: ""
  base_url: https://openrouter.ai/api/v1
  http_referer: ""
  app_title: ""
  require_parameters: true
  min_request_interval_sec: 0.0

google:
  api_key: ""

anthropic:
  api_key: ""

mujoco:
  headless: false
  render_width: 640
  render_height: 480

outputs:
  dir: outputs
  log_file: llm_history.txt
  json_export: true
  heatmap: true
  save_obs: false

hydra:
  run:
    dir: .
  output_subdir: null
